title: Member Added To Local Administrators Group
id: e28f4063-9c55-4a77-8c02-f1a2519bb5a7
status: experimental
description: Detects a user being added to the local Administrators group, which can indicate privilege escalation or persistence.
references:
  - https://attack.mitre.org/techniques/T1098/
author: Amrita
date: 2026-11-21
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4732
    TargetUserName: Administrators
  condition: selection
falsepositives:
  - Planned administrative changes by IT staff
level: high
